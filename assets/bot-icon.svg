<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="botBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="botFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7dffea"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <circle cx="32" cy="32" r="32" fill="url(#botBg)"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- antenna -->
  <line x1="32" y1="10" x2="32" y2="16" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.85"/>
  <circle cx="32" cy="9" r="2.6" fill="#7dffea"/>

  <!-- head -->
  <rect x="14" y="16" width="36" height="30" rx="11" fill="url(#botFace)"/>
  <rect x="14" y="16" width="36" height="30" rx="11" fill="none" stroke="#cbd5e1" stroke-width="0.6"/>

  <!-- eyes -->
  <circle cx="24.5" cy="31" r="4.6" fill="url(#eyeGlow)"/>
  <circle cx="39.5" cy="31" r="4.6" fill="url(#eyeGlow)"/>
  <circle cx="23.2" cy="29.4" r="1.3" fill="#ffffff"/>
  <circle cx="38.2" cy="29.4" r="1.3" fill="#ffffff"/>

  <!-- smile -->
  <path d="M25 38.5 Q32 43 39 38.5" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>

  <!-- side nodes -->
  <rect x="10" y="26" width="4" height="10" rx="2" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="50" y="26" width="4" height="10" rx="2" fill="#ffffff" fill-opacity="0.9"/>
</svg>
