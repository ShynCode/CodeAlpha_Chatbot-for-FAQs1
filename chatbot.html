<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ Assistant | AssessAI</title>
  <link rel="icon" type="image/svg+xml" href="assets/bot-icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --primary-soft: rgba(26, 115, 232, 0.1);
      --accent: #34a853;
      --bg: #f4f6fb;
      --surface: #ffffff;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --bot-bg: #ffffff;
      --shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="dark"] {
      --bg: #0b0f1a;
      --surface: #151b2b;
      --bot-bg: #1e293b;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: #1e293b;
      --primary-soft: rgba(26, 115, 232, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.35);
    }
    .brand-title { display: flex; align-items: center; gap: 8px; }
    .pro-badge {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 6px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
    }
    .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 8px 12px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .back-link:hover { background: var(--primary-soft); color: var(--primary); }
    .topbar h1 { font-size: 1rem; font-weight: 600; }
    .topbar p { font-size: 0.72rem; color: var(--text-muted); }
    .badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(52, 168, 83, 0.12);
      color: var(--accent);
    }
    .badge.offline { background: rgba(234, 67, 53, 0.12); color: #ea4335; }
    .topbar-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 38px; height: 38px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }
    .icon-btn:hover { border-color: var(--primary); color: var(--primary); }

    .chat-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      min-height: 0;
    }
    .nlp-info {
      background: var(--primary-soft);
      border: 1px solid rgba(26, 115, 232, 0.2);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.75rem;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chat-window {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 8px 4px 16px;
      min-height: 400px;
      max-height: calc(100vh - 280px);
    }
    .msg {
      display: flex;
      gap: 10px;
      max-width: 88%;
      animation: fadeUp 0.35s var(--ease);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; margin-left: auto; }
    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .msg.bot .avatar {
      background: transparent;
      padding: 0;
      overflow: hidden;
    }
    .msg.bot .avatar img { width: 100%; height: 100%; display: block; }
    .msg.user .avatar {
      background: var(--border);
      color: var(--text-secondary);
    }
    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.55;
    }
    .msg.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-xs, 0 1px 2px rgba(0,0,0,0.05));
    }
    .msg.user .bubble {
      background: linear-gradient(135deg, var(--primary), #4285f4);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .meta {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 6px;
      padding: 0 4px;
    }
    .match-info {
      margin-top: 8px;
      padding: 8px 12px;
      background: var(--primary-soft);
      border-radius: 8px;
      font-size: 0.72rem;
      color: var(--text-secondary);
    }
    .match-info strong { color: var(--primary); }
    .typing {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: fit-content;
    }
    .typing span {
      width: 7px; height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s ease infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .chip {
      padding: 8px 14px;
      font-size: 0.78rem;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--primary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover { background: var(--primary-soft); border-color: var(--primary); }

    .input-area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }
    .input-row { display: flex; gap: 10px; align-items: flex-end; }
    #user-input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      resize: none;
      outline: none;
      max-height: 100px;
      line-height: 1.4;
    }
    #send-btn {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }
    #send-btn:hover:not(:disabled) { transform: scale(1.05); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .input-hint {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: center;
    }

    .error-banner {
      display: none;
      background: rgba(234, 67, 53, 0.1);
      border: 1px solid rgba(234, 67, 53, 0.3);
      color: #c5221f;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }
    .error-banner.show { display: block; }
    .error-banner code {
      background: rgba(0,0,0,0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="index.html" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </a>
      <div class="brand">
        <img class="brand-avatar" src="assets/bot-icon.svg" alt="FAQ Assistant" />
        <div>
          <div class="brand-title">
            <h1>FAQ Assistant</h1>
            <span class="pro-badge">PRO</span>
          </div>
          <p>AI & Technology · NLP-powered matching</p>
        </div>
      </div>
    </div>
    <span class="badge" id="status-badge">Connecting…</span>
    <div class="topbar-actions">
      <button class="icon-btn" id="clear-btn" title="Clear chat" aria-label="Clear">🗑</button>
      <button class="icon-btn" id="theme-btn" title="Theme" aria-label="Theme">🌙</button>
    </div>
  </header>

  <div class="chat-wrap">
    <div class="error-banner" id="error-banner">
      Server offline. Start the backend: <code>python server.py</code> then refresh.
    </div>
    <div class="nlp-info">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>
      Powered by NLTK preprocessing + cosine similarity (TF-IDF)
    </div>

    <div class="chat-window" id="chat-window" role="log" aria-live="polite"></div>

    <div class="suggestions" id="suggestions">
      <button class="chip" data-q="What is Artificial Intelligence?">What is AI?</button>
      <button class="chip" data-q="What is Machine Learning?">Machine Learning</button>
      <button class="chip" data-q="How do I start learning programming?">Learn programming</button>
      <button class="chip" data-q="What is cloud computing?">Cloud computing</button>
    </div>

    <div class="input-area">
      <div class="input-row">
        <textarea id="user-input" rows="1" placeholder="Ask a question about AI, ML, coding, or tech…"></textarea>
        <button id="send-btn" aria-label="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <p class="input-hint">Press Enter to send · Best match selected via cosine similarity</p>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    const chatWindow = document.getElementById("chat-window");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const statusBadge = document.getElementById("status-badge");
    const errorBanner = document.getElementById("error-banner");
    let isProcessing = false;
    let serverOnline = false;

    function formatTime() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function appendMessage(text, role, extra = null) {
      const row = document.createElement("div");
      row.className = `msg ${role}`;
      const av = document.createElement("div");
      av.className = "avatar";
      if (role === "bot") {
        av.innerHTML = `<img src="assets/bot-icon.svg" alt="Bot" />`;
      } else {
        av.textContent = "You";
      }
      const wrap = document.createElement("div");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(bubble);
      if (extra) {
        const info = document.createElement("div");
        info.className = "match-info";
        info.innerHTML = extra;
        wrap.appendChild(info);
      }
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = formatTime();
      wrap.appendChild(meta);
      row.appendChild(av);
      row.appendChild(wrap);
      chatWindow.appendChild(row);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    let typingEl = null;
    function showTyping() {
      hideTyping();
      typingEl = document.createElement("div");
      typingEl.className = "msg bot";
      typingEl.innerHTML = `<div class="avatar"><img src="assets/bot-icon.svg" alt="Bot" /></div><div class="typing"><span></span><span></span><span></span></div>`;
      chatWindow.appendChild(typingEl);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }
    function hideTyping() {
      if (typingEl) { typingEl.remove(); typingEl = null; }
    }

    async function checkHealth() {
      try {
        const res = await fetch(`${API_BASE}/api/health`);
        const data = await res.json();
        serverOnline = data.status === "ok";
        statusBadge.textContent = serverOnline ? "NLP Online" : "Offline";
        statusBadge.classList.toggle("offline", !serverOnline);
        errorBanner.classList.toggle("show", !serverOnline);
      } catch {
        serverOnline = false;
        statusBadge.textContent = "Offline";
        statusBadge.classList.add("offline");
        errorBanner.classList.add("show");
      }
    }

    async function sendMessage(text) {
      const question = (text || userInput.value).trim();
      if (!question || isProcessing) return;

      isProcessing = true;
      sendBtn.disabled = true;
      userInput.value = "";
      appendMessage(question, "user");
      showTyping();

      if (!serverOnline) {
        hideTyping();
        appendMessage(
          "The NLP server is not running. Open a terminal in the project folder and run: python server.py",
          "bot"
        );
        isProcessing = false;
        sendBtn.disabled = false;
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: question }),
        });
        const data = await res.json();
        hideTyping();

        if (!res.ok) throw new Error(data.error || "Request failed");

        let extra = null;
        if (data.matched_question) {
          const pct = Math.round(data.similarity * 100);
          extra = `<strong>Matched:</strong> ${data.matched_question}<br>
            <strong>Category:</strong> ${data.category || "—"} · 
            <strong>Similarity:</strong> ${pct}% (${data.confidence})`;
        }
        appendMessage(data.answer, "bot", extra);
      } catch (err) {
        hideTyping();
        appendMessage("Sorry, something went wrong. Make sure the server is running.", "bot");
        console.error(err);
      } finally {
        isProcessing = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    sendBtn.addEventListener("click", () => sendMessage());
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    document.getElementById("suggestions").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (chip) sendMessage(chip.dataset.q);
    });
    document.getElementById("clear-btn").addEventListener("click", () => {
      chatWindow.innerHTML = "";
      showWelcome();
    });
    document.getElementById("theme-btn").addEventListener("click", () => {
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      document.documentElement.toggleAttribute("data-theme", !dark ? "dark" : "");
      document.getElementById("theme-btn").textContent = dark ? "🌙" : "☀️";
    });

    function showWelcome() {
      appendMessage(
        "Hello! I'm your FAQ assistant for AI & Technology topics. Ask me anything — I'll find the best matching answer using NLTK text processing and cosine similarity.",
        "bot"
      );
    }

    showWelcome();
    checkHealth();
    userInput.focus();
  </script>
</body>
</html>
