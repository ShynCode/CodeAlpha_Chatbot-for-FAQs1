<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TechBot — FAQ Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0f18;
    --surface:   #151722;
    --card:      #1e2133;
    --border:    #2a2d42;
    --accent:    #4f8ef7;
    --accent2:   #38d9a9;
    --text:      #e8eaf6;
    --muted:     #7b82a8;
    --user-bg:   #1e3a6e;
    --bot-bg:    #1e2133;
    --radius:    16px;
  }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ── WRAPPER ── */
  .chat-wrapper {
    width: 100%;
    max-width: 720px;
    height: 92vh;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }

  /* ── HEADER ── */
  .chat-header {
    padding: 18px 24px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header-avatar {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .header-info h1 { font-size: 16px; font-weight: 600; }
  .header-info p  { font-size: 12px; color: var(--accent2); margin-top: 2px; }
  .status-dot {
    width: 8px; height: 8px;
    background: var(--accent2);
    border-radius: 50%;
    margin-left: auto;
    box-shadow: 0 0 8px var(--accent2);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.4; }
  }

  /* ── MESSAGES ── */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── BUBBLE ── */
  .message { display: flex; gap: 10px; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .message.user { flex-direction: row-reverse; }

  .bubble-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
    background: var(--card);
    border: 1px solid var(--border);
  }
  .message.user .bubble-avatar {
    background: linear-gradient(135deg, var(--accent), #2563eb);
  }

  .bubble-content { max-width: 75%; display: flex; flex-direction: column; gap: 4px; }
  .message.user .bubble-content { align-items: flex-end; }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.6;
    border: 1px solid transparent;
  }
  .message.bot  .bubble {
    background: var(--bot-bg);
    border-color: var(--border);
    border-top-left-radius: 4px;
  }
  .message.user .bubble {
    background: var(--user-bg);
    border-color: #2a4a8a;
    border-top-right-radius: 4px;
    color: #c8d8ff;
  }

  .confidence {
    font-size: 10px;
    color: var(--accent2);
    background: rgba(56,217,169,0.1);
    border: 1px solid rgba(56,217,169,0.2);
    padding: 2px 8px;
    border-radius: 20px;
    align-self: flex-start;
  }

  /* ── TYPING INDICATOR ── */
  .typing { display: none; }
  .typing.show { display: flex; }
  .typing-dots {
    background: var(--bot-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-top-left-radius: 4px;
    padding: 14px 18px;
    display: flex; gap: 5px; align-items: center;
  }
  .typing-dots span {
    width: 7px; height: 7px;
    background: var(--muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* ── INPUT AREA ── */
  .chat-input {
    padding: 16px 20px;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .chat-input input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 18px;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .chat-input input:focus { border-color: var(--accent); }
  .chat-input input::placeholder { color: var(--muted); }

  .send-btn {
    width: 46px; height: 46px;
    background: linear-gradient(135deg, var(--accent), #2563eb);
    border: none; border-radius: 12px;
    color: white; font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, opacity 0.15s;
    flex-shrink: 0;
  }
  .send-btn:hover { transform: scale(1.07); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ── SUGGESTIONS ── */
  .suggestions {
    padding: 0 20px 12px;
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .suggestion-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Sora', sans-serif;
  }
  .suggestion-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(79,142,247,0.08);
  }

  @media (max-width: 600px) {
    .chat-wrapper { height: 100vh; border-radius: 0; border: none; }
    .bubble-content { max-width: 88%; }
  }
</style>
</head>
<body>

<div class="chat-wrapper">

  <!-- Header -->
  <div class="chat-header">
    <div class="header-avatar">🤖</div>
    <div class="header-info">
      <h1>TechBot</h1>
      <p>Online Store Assistant</p>
    </div>
    <div class="status-dot"></div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages"></div>

  <!-- Typing indicator -->
  <div class="message bot typing" id="typingIndicator">
    <div class="bubble-avatar">🤖</div>
    <div class="typing-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Suggestion chips -->
  <div class="suggestions" id="suggestions">
    <div class="suggestion-chip" onclick="sendSuggestion('How do I track my order?')">Track order</div>
    <div class="suggestion-chip" onclick="sendSuggestion('What is the return policy?')">Return policy</div>
    <div class="suggestion-chip" onclick="sendSuggestion('What payment methods are accepted?')">Payment methods</div>
    <div class="suggestion-chip" onclick="sendSuggestion('How do I cancel my order?')">Cancel order</div>
  </div>

  <!-- Input -->
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Ask me anything about your order..." autocomplete="off"/>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>

</div>

<script>
  const API_URL = "http://127.0.0.1:5000/chat";

  // Welcome message on load
  window.onload = () => {
    addBotMessage("👋 Hi! I'm TechBot, your online store assistant. Ask me anything about orders, shipping, returns, or payments!", null);
  };

  function addBotMessage(text, confidence) {
    const messages = document.getElementById("chatMessages");
    const div = document.createElement("div");
    div.className = "message bot";
    div.innerHTML = `
      <div class="bubble-avatar">🤖</div>
      <div class="bubble-content">
        <div class="bubble">${text}</div>
        ${confidence !== null ? `<span class="confidence">Match: ${Math.round(confidence * 100)}%</span>` : ""}
      </div>`;
    messages.appendChild(div);
    scrollToBottom();
  }

  function addUserMessage(text) {
    const messages = document.getElementById("chatMessages");
    const div = document.createElement("div");
    div.className = "message user";
    div.innerHTML = `
      <div class="bubble-avatar">👤</div>
      <div class="bubble-content">
        <div class="bubble">${text}</div>
      </div>`;
    messages.appendChild(div);
    scrollToBottom();
  }

  function scrollToBottom() {
    const messages = document.getElementById("chatMessages");
    messages.scrollTop = messages.scrollHeight;
  }

  function showTyping(show) {
    const t = document.getElementById("typingIndicator");
    t.classList.toggle("show", show);
    if (show) scrollToBottom();
  }

  function setDisabled(val) {
    document.getElementById("userInput").disabled = val;
    document.getElementById("sendBtn").disabled = val;
  }

  async function sendMessage() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;

    addUserMessage(text);
    input.value = "";
    document.getElementById("suggestions").style.display = "none";
    showTyping(true);
    setDisabled(true);

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      showTyping(false);
      addBotMessage(data.answer, data.confidence);
    } catch (err) {
      showTyping(false);
      addBotMessage("⚠️ Connection error. Make sure the server is running with <code>python3 app.py</code>", null);
    }

    setDisabled(false);
    input.focus();
  }

  function sendSuggestion(text) {
    document.getElementById("userInput").value = text;
    sendMessage();
  }

  // Enter key to send
  document.getElementById("userInput").addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });
</script>
</body>
</html>
